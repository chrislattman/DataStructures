[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa"
version = "1.0.0"
description = "Your package description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Add your actual production/runtime dependencies here if you have any
]

[project.optional-dependencies]
dev = [
    "Sphinx==7.2.6",
    "sphinx_rtd_theme==2.0.0",
    "coverage==7.4.0",
    "autoflake",
    "black",
    "isort",
    "pyupgrade",
    "mypy",
    "pip-tools",
    "pydocstyle",
    "pycodestyle",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
